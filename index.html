          { text: "โคฟี อันนัน (Kofi Annan)", isCorrect: true, rationale: "นายโคฟี อันนัน เลขาธิการสหประชาชาติ เดินทางมาทูลเกล้าฯ ถวายรางวัลนี้ด้วยตนเองแด่ ร.9 เมื่อวันที่ 26 พฤษภาคม พ.ศ. 2549" },
          { text: "เซอร์จอห์น เบาว์ริง", isCorrect: false, rationale: "ท่านนี้เป็นทูตอังกฤษยุค ร.4 ไม่เกี่ยวข้องกับหน่วยงานพัฒนาขององค์การสหประชาชาติ" },
          { text: "ลอร์ด หลุยส์ เมานต์แบตเทน", isCorrect: false, rationale: "ท่านนี้เป็นผู้บัญชาการทหารพันธมิตรร่วมตรวจพลรบในสงครามโลกครั้งที่ 2 กับ ร.8" },
          { text: "จอห์น ครอว์เฟิด", isCorrect: false, rationale: "ท่านนี้เป็นทูตเจรจาการค้าชาวอังกฤษในสมัย ร.2 และ ร.3 ไม่เกี่ยวกับ UN" }
        ],
        hint: "เลขาธิการชาวกานาผู้มีบทบาทสำคัญด้านสันติภาพและการพัฒนาอย่างยั่งยืนระดับโลก"
      }
    ];

    // Exponential backoff API fetch wrapper for Gemini
    const callGeminiModel = async (prompt, systemInstruction = "") => {
      const apiKey = ""; // Left empty for automatic Canvas injection at runtime
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      
      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: systemInstruction ? {
          parts: [{ text: systemInstruction }]
        } : undefined
      };

      let delay = 1000;
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          
          if (!response.ok) {
            throw new Error(`Gemini API HTTP Error Status: ${response.status}`);
          }
          
          const result = await response.json();
          const generatedText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (generatedText) {
            return generatedText;
          }
          throw new Error("Invalid response format or empty text returned.");
        } catch (error) {
          console.warn(`Gemini Attempt ${attempt + 1} failed. Retrying...`, error);
          if (attempt === 2) {
            throw error; // Propagate after exhaustion
          }
          await new Promise(resolve => setTimeout(resolve, delay));
          delay *= 2;
        }
      }
    };

    // Helper to render simple styled paragraph and bold text in React
    const formatAIResponse = (text) => {
      if (!text) return null;
      return text.split('\n').map((paragraph, index) => {
        if (!paragraph.trim()) return null;
        
        // Match Markdown bolding **text**
        const tokens = paragraph.split(/(\*\*.*?\*\*)/g);
        return (
          <p key={index} className="text-xs text-slate-700 leading-relaxed mb-2.5">
            {tokens.map((token, j) => {
              if (token.startsWith('**') && token.endsWith('**')) {
                return (
                  <strong key={j} className="font-extrabold text-amber-950">
                    {token.slice(2, -2)}
                  </strong>
                );
              }
              return token;
            })}
          </p>
        );
      });
    };

    function App() {
      const [currentTab, setCurrentTab] = useState("home"); // home, kings, quiz, ai_tutor, library
      const [librarySubTab, setLibrarySubTab] = useState("cards"); // cards, search, bookmarks
      const [bookmarks, setBookmarks] = useState(() => {
        const saved = localStorage.getItem("chakri_bookmarks");
        return saved ? JSON.parse(saved) : [];
      });
      const [activeKing, setActiveKing] = useState(null);
      
      // Quiz States
      const [quizIndex, setQuizIndex] = useState(0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [showRationale, setShowRationale] = useState(false);
      const [quizScore, setQuizScore] = useState(0);
      const [quizCompleted, setQuizCompleted] = useState(false);
      
      // Flashcard and Search States
      const [searchQuery, setSearchQuery] = useState("");
      const [cardIndex, setCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      // AI Tutor States
      const [aiQuery, setAiQuery] = useState("");
      const [aiHistory, setAiHistory] = useState([
        {
          role: "assistant",
          text: "สวัสดีครับ ยินดีต้อนรับสู่ 'ห้องเรียนนักประวัติศาสตร์จักรี' คุณสามารถถามคำถามทางประวัติศาสตร์ ข้อมูลรัชกาลต่างๆ หรือขอให้อธิบายแนวคิดเชิงลึกได้เลยครับ!"
        }
      ]);
      const [isAiLoading, setIsAiLoading] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        localStorage.setItem("chakri_bookmarks", JSON.stringify(bookmarks));
      }, [bookmarks]);

      useEffect(() => {
        // Auto scroll to latest chat messages
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [aiHistory, isAiLoading]);

      const toggleBookmark = (id, type) => {
        const key = `${type}-${id}`;
        setBookmarks(prev => {
          if (prev.includes(key)) {
            return prev.filter(item => item !== key);
          } else {
            return [...prev, key];
          }
        });
      };

      const isBookmarked = (id, type) => {
        return bookmarks.includes(`${type}-${id}`);
      };

      // Search matching logic across textbook
      const searchResults = useMemo(() => {
        if (!searchQuery.trim()) return [];
        const q = searchQuery.toLowerCase();
        const results = [];

        kingsList.forEach(king => {
          let matched = false;
          let matchText = "";
          if (king.fullName.toLowerCase().includes(q) || king.title.toLowerCase().includes(q)) {
            matched = true;
            matchText = king.fullName;
          } else {
            const matchedFact = king.keyFacts.find(fact => 
              fact.label.toLowerCase().includes(q) || fact.val.toLowerCase().includes(q)
            );
            if (matchedFact) {
              matched = true;
              matchText = `${matchedFact.label}: ${matchedFact.val}`;
            }
          }
          if (matched) {
            results.push({ type: "king", id: king.id, title: king.title, subtitle: king.fullName, snippet: matchText, raw: king });
          }
        });

        flashcardsData.forEach((card, idx) => {
          if (card.term.toLowerCase().includes(q) || card.definition.toLowerCase().includes(q)) {
            results.push({ type: "card", id: idx, title: card.term, subtitle: "การ์ดคำศัพท์", snippet: card.definition, raw: card });
          }
        });

        return results;
      }, [searchQuery]);

      const handleAnswerSelect = (optionIdx) => {
        if (selectedAnswer !== null) return;
        setSelectedAnswer(optionIdx);
        setShowRationale(true);
        if (quizQuestions[quizIndex].answerOptions[optionIdx].isCorrect) {
          setQuizScore(prev => prev + 1);
        }
      };

      const handleNextQuestion = () => {
        setSelectedAnswer(null);
        setShowRationale(false);
        if (quizIndex < quizQuestions.length - 1) {
          setQuizIndex(prev => prev + 1);
        } else {
          setQuizCompleted(true);
        }
      };

      const resetQuiz = () => {
        setQuizIndex(0);
        setSelectedAnswer(null);
        setShowRationale(false);
        setQuizScore(0);
        setQuizCompleted(false);
      };

      const handleSendAiMessage = async (customPrompt = "") => {
        const queryToSend = customPrompt || aiQuery;
        if (!queryToSend.trim()) return;

        // Append user query to chat thread
        setAiHistory(prev => [...prev, { role: "user", text: queryToSend }]);
        setAiQuery("");
        setIsAiLoading(true);

        const systemInstruction = "คุณคือ 'ศาสตราจารย์สถาบันพระมหากษัตริย์และประวัติศาสตร์จักรี' นักประวัติศาสตร์ชาวไทยผู้เชี่ยวชาญ คอยแนะนำข้อมูลแก่นักเรียน นักศึกษา ตอบคำถามอย่างละเอียด ถูกต้องตามวิชาการประวัติศาสตร์สยาม นอบน้อม สุภาพ อ้างอิงประเด็น ร.1 - ร.9 และแนวคิดความเชื่อ (บิดา-บุตร, พราหมณ์-ฮินดู, พุทธศาสนา) ให้ยกตัวอย่างชัดเจนสอดคล้องกับคอร์สเรียนวิชาสังคมศึกษาไทย";
        
        try {
          const aiResponse = await callGeminiModel(queryToSend, systemInstruction);
          setAiHistory(prev => [...prev, { role: "assistant", text: aiResponse }]);
        } catch (error) {
          setAiHistory(prev => [...prev, { 
            role: "assistant", 
            text: "ขออภัยเป็นอย่างยิ่งครับ เกิดความผิดพลาดชั่วคราวในการประมวลผลข้อมูลผ่านเครือข่ายความปลอดภัย กรุณาลองใหม่อีกครั้งครับ" 
          }]);
        } finally {
          setIsAiLoading(false);
        }
      };

      // Auto-trigger detailed AI Explainer for Quiz Questions
      const handleAskAiAboutQuiz = (questionText, rationaleText) => {
        setCurrentTab("ai_tutor");
        const prompt = `ช่วยอธิบายความรู้ประวัติศาสตร์เพิ่มเติมเกี่ยวกับข้อสอบข้อนี้อย่างลึกซึ้ง: "${questionText}" (คำอธิบายเบื้องต้น: ${rationaleText}) ให้เบื้องหลังทางประวัติศาสตร์และรายละเอียดเสริมเพื่อให้จดจำไปสอบได้ดียิ่งขึ้น`;
        handleSendAiMessage(prompt);
      };

      return (
        <div className="flex flex-col h-full bg-slate-50 relative justify-between">
          
          {/* Header Area */}
          <header className="bg-gradient-to-r from-amber-600 via-amber-500 to-yellow-500 text-white py-4 px-4 shadow-md flex items-center justify-between rounded-t-3xl">
            <div className="flex items-center gap-2">
              <div className="bg-white/20 p-1.5 rounded-xl">
                <Icons.Crown className="w-6 h-6 text-white"/>
              </div>
              <div>
                <h1 className="font-bold text-sm leading-tight">คลังปัญญา ราชวงศ์จักรี</h1>
                <p className="text-xs text-yellow-100 royal-font">Chakri Dynasty Companion</p>
              </div>
            </div>
            {/* Quick AI Sparks Button */}
            <button 
              onClick={() => setCurrentTab("ai_tutor")}
              className="relative bg-white/15 p-2 rounded-xl active:scale-95 transition-transform flex items-center gap-1 font-bold text-xs"
            >
              <Icons.Sparkles className="w-4 h-4 text-yellow-200" />
              <span>ถาม AI</span>
            </button>
          </header>

          {/* Main App Screens */}
          <main className="flex-1 overflow-y-auto px-4 py-3 no-scrollbar pb-24">
            
            {/* Tab 1: Home Screen (Belief pillars) */}
            {currentTab === "home" && (
              <div className="space-y-4">
                
                {/* Intro Card */}
                <div className="bg-white p-4 rounded-2xl border border-amber-100 shadow-sm relative overflow-hidden">
                  <div className="absolute -right-6 -bottom-6 opacity-5">
                    <Icons.Crown className="w-32 h-32 text-amber-600"/>
                  </div>
                  <h2 className="royal-font text-2xl font-bold text-amber-800 mb-1">{conceptData.title}</h2>
                  <p className="text-xs text-slate-500 mb-3">วิชาสถาบันพระมหากษัตริย์ไทยกับโครงสร้างความเชื่อสยาม</p>
                  <p className="text-sm text-slate-700 leading-relaxed bg-amber-50/50 p-3 rounded-xl border border-amber-50">
                    {conceptData.intro}
                  </p>
                </div>

                {/* 3 Pillars of Belief */}
                <div className="space-y-3">
                  <h3 className="text-sm font-bold text-slate-700 flex items-center gap-2">
                    <span className="w-1.5 h-4 bg-amber-500 rounded-full inline-block"></span>
                    แนวคิดทางสถาบันกษัตริย์ 3 ประการ
                  </h3>
                  {conceptData.pillars.map((item) => (
                    <div key={item.id} className="bg-white p-3.5 rounded-xl border border-slate-100 shadow-sm flex gap-3 items-start">
                      <div className="w-7 h-7 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">
                        {item.id}
                      </div>
                      <div className="space-y-0.5">
                        <h4 className="text-sm font-semibold text-slate-800">{item.title}</h4>
                        <p className="text-xs text-slate-600 leading-relaxed">{item.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Conceptual Terms Explanation */}
                <div className="space-y-3">
                  <h3 className="text-sm font-bold text-slate-700 flex items-center gap-2">
                    <span className="w-1.5 h-4 bg-amber-500 rounded-full inline-block"></span>
                    ความหมายแห่งสัญลักษณ์ในประวัติศาสตร์ไทย
                  </h3>
                  <div className="grid grid-cols-1 gap-2.5">
                    {conceptData.terms.map((term, idx) => (
                      <div key={idx} className="bg-gradient-to-br from-white to-amber-50/20 p-3.5 rounded-xl border border-amber-100 shadow-sm space-y-1">
                        <div className="flex items-center justify-between">
                          <span className="text-sm font-bold text-amber-800 royal-font text-[16px]">{term.name}</span>
                          <span className="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-semibold">ศัพท์เฉพาะตำรา</span>
                        </div>
                        <p className="text-xs text-slate-600 leading-relaxed">{term.definition}</p>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Quick AI Suggestion Card */}
                <div className="bg-gradient-to-r from-amber-600 to-amber-700 text-white p-4 rounded-2xl flex items-center justify-between shadow-sm">
                  <div className="space-y-1">
                    <h4 className="text-xs font-semibold text-yellow-300 flex items-center gap-1">
                      <Icons.Sparkles className="w-4 h-4" />
                      สงสัยเรื่องไหน ถาม AI ได้ทันที!
                    </h4>
                    <p className="text-[11px] text-amber-100">คุยกับผู้เชี่ยวชาญประวัติศาสตร์สยามแบบโต้ตอบ</p>
                  </div>
                  <button 
                    onClick={() => setCurrentTab("ai_tutor")}
                    className="bg-white text-amber-800 hover:bg-yellow-50 text-xs font-bold py-2 px-3 rounded-xl flex items-center gap-1 active:scale-95 transition-all"
                  >
                    ถามเลย
                    <Icons.ArrowRight className="w-4 h-4"/>
                  </button>
                </div>

              </div>
            )}

            {/* Tab 2: Kings Directory */}
            {currentTab === "kings" && (
              <div className="space-y-4">
                
                {/* Search Bar Shortcut */}
                <div className="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-2">
                  <Icons.Search className="text-slate-400"/>
                  <input 
                    type="text" 
                    placeholder="ค้นหาข้อมูลกษัตริย์ พระนาม หรือประวัติ..." 
                    className="text-xs text-slate-700 w-full focus:outline-none"
                    value={searchQuery}
                    onChange={(e) => {
                      setSearchQuery(e.target.value);
                      setCurrentTab("library");
                      setLibrarySubTab("search");
                    }}
                  />
                </div>

                {/* Kings List cards */}
                {!activeKing ? (
                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="text-sm font-bold text-slate-700 flex items-center gap-2">
                        <span className="w-1.5 h-4 bg-amber-500 rounded-full inline-block"></span>
                        ทำเนียบมหากษัตริย์ไทย (รัตนโกสินทร์)
                      </h3>
                      <span className="text-[10px] text-slate-400">เลือกองค์เพื่อเจาะลึก</span>
                    </div>

                    <div className="grid grid-cols-1 gap-2.5">
                      {kingsList.map((king) => (
                        <div 
                          key={king.id}
                          onClick={() => setActiveKing(king)}
                          className="bg-white p-3.5 rounded-xl border border-slate-100 shadow-sm hover:border-amber-200 active:scale-[0.99] transition-all cursor-pointer flex justify-between items-center relative overflow-hidden"
                        >
                          <div className="space-y-1 z-10">
                            <div className="flex items-center gap-2">
                              <span className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-md">{king.title}</span>
                              <span className="text-[10px] text-slate-400 font-medium">{king.reign}</span>
                            </div>
                            <h4 className="text-sm font-bold text-slate-800 leading-tight">{king.fullName}</h4>
                            <p className="text-[11px] text-slate-500 font-medium">{king.badge}</p>
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0 z-10">
                            {isBookmarked(king.id, "king") && (
                              <span className="text-amber-500"><Icons.Bookmark className="w-4 h-4" fill="currentColor"/></span>
                            )}
                            <Icons.ChevronRight className="text-slate-300 w-5 h-5"/>
                          </div>
                          <div className="absolute right-3 -bottom-2 opacity-[0.03] text-amber-900 pointer-events-none">
                            <Icons.Crown className="w-16 h-16"/>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  // Detailed view of a single King
                  <div className="bg-white rounded-2xl border border-amber-100 shadow-sm overflow-hidden space-y-4">
                    
                    {/* Cover Area */}
                    <div className="bg-gradient-to-br from-amber-800 to-amber-600 text-white p-5 space-y-2 relative">
                      <button 
                        onClick={() => setActiveKing(null)}
                        className="absolute top-4 left-4 bg-white/10 hover:bg-white/20 text-white p-1.5 rounded-lg text-[10px] font-bold active:scale-95 transition-transform"
                      >
                        ย้อนกลับ
                      </button>
                      <button 
                        onClick={() => toggleBookmark(activeKing.id, "king")}
                        className="absolute top-4 right-4 bg-white/10 hover:bg-white/20 text-white p-1.5 rounded-lg active:scale-95 transition-transform"
                      >
                        <Icons.Bookmark className="w-4 h-4 text-white" fill={isBookmarked(activeKing.id, "king") ? "currentColor" : "none"} />
                      </button>
                      
                      <div className="pt-6 space-y-1">
                        <span className="text-[10px] font-bold text-amber-200 bg-amber-900/40 px-2 py-0.5 rounded-md inline-block">{activeKing.title}</span>
                        <h3 className="royal-font text-2xl font-bold leading-tight">{activeKing.fullName}</h3>
                        <p className="text-xs text-yellow-100">{activeKing.reign}</p>
                        <span className="inline-block text-[10px] bg-yellow-500 text-amber-950 font-bold px-2.5 py-0.5 rounded-full mt-2">
                          {activeKing.badge}
                        </span>
                      </div>
                    </div>

                    {/* Content Detail List */}
                    <div className="p-4 space-y-4">
                      
                      {/* AI integration button inside king details */}
                      <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 flex justify-between items-center">
                        <div className="space-y-0.5">
                          <h5 className="text-xs font-bold text-amber-950 flex items-center gap-1">
                            <Icons.Sparkles className="w-3.5 h-3.5 text-amber-600" />
                            อยากรู้ลึกกว่าวิชาการทั่วไป?
                          </h5>
                          <p className="text-[10px] text-slate-600">กดให้ AI สรุปแง่มุมพิเศษและข้อสอบเกี่ยวกับพระองค์</p>
                        </div>
                        <button 
                          onClick={() => {
                            setCurrentTab("ai_tutor");
                            handleSendAiMessage(`ช่วยเล่าแง่มุมความรู้และข้อสอบประวัติศาสตร์ที่น่าสนใจเกี่ยวกับ ${activeKing.fullName} (${activeKing.title}) ให้ฟังหน่อยครับ`);
                          }}
                          className="bg-amber-600 hover:bg-amber-700 text-white text-[10px] font-bold px-3 py-2 rounded-lg active:scale-95 transition-transform"
                        >
                          วิเคราะห์ AI
                        </button>
                      </div>

                      <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                        <Icons.Crown className="w-4 h-4 text-amber-500"/>
                        สาระสำคัญตามคลังวิชาสถาบัน
                      </h4>

                      <div className="space-y-3.5">
                        {activeKing.keyFacts.map((fact, idx) => (
                          <div key={idx} className="space-y-1 bg-slate-50/70 p-3 rounded-xl border border-slate-100">
                            <span className="text-xs font-bold text-amber-800 shrink-0 block">
                              {fact.label}
                            </span>
                            <p className="text-xs text-slate-700 leading-relaxed">
                              {fact.val}
                            </p>
                          </div>
                        ))}
                      </div>

                      <div className="pt-2">
                        <button 
                          onClick={() => setActiveKing(null)}
                          className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-3 px-4 rounded-xl active:scale-95 transition-all text-center block"
                        >

                    </div>

                      <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div

                    <div className="bg-white p-4 rounded-2xl border border-amber-100 shadow-sm space-y-4">

                    </div>

                    <div className="space-y-2">

                        if (selectedAnswer !== null) {
                          if (opt.isCorrect) {
                            btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-950 font-semibold";

                            btnStyle = "bg-rose-50 border-rose-500 text-rose-950";

                            btnStyle = "bg-slate-50 border-slate-100 text-slate-400 opacity-60";
                          }

                          <button 
                            key={idx}
                            onClick={() => handleAnswerSelect(idx)}
                            disabled={selectedAnswer !== null}
                            className={`w-full p-3.5 rounded-xl border text-xs text-left active:scale-[0.99] transition-all flex items-center justify-between ${btnStyle}`}

                              <span className="text-rose-600 font-bold">✗ ผิด</span>

                          >
                            {quizIndex < quizQuestions.length - 1 ? "ทำข้อต่อไป" : "ดูผลคะแนนสุทธิ"}

                        </div>
                      </div>

                      </span>

                        : "พยายามได้ดีมาก! แนะนำให้สลับไปเรียนรู้ผ่านประวัติตามทำเนียบและการ์ดคำศัพท์ หรือลองถาม AI เพิ่มเติมในเรื่องที่คุณตอบผิด"}
                    </p>

                      >
                        <Icons.RotateCcw className="w-4 h-4"/>

                      </button>
                    </div>

                  </div>
                )}

              </div>

                  <div className="space-y-0.5">
                    <h4 className="text-xs font-bold text-yellow-300 flex items-center gap-1">
                      <Icons.Sparkles className="w-3.5 h-3.5" />

                    </h4>
                    <p className="text-[10px] text-slate-300">ขับเคลื่อนด้วย Gemini 3.1 Flash</p>
                  </div>

                    onClick={() => {
                      setAiHistory([

                          role: "assistant",

                        <span className="text-xs text-slate-500">ศาสตราจารย์ AI กำลังค้นคว้าตำราประวัติศาสตร์จักรี...</span>
                      </div>
                    </div>
                  )}
                  <div ref={chatEndRef} />

                <div className="flex gap-2">

                    value={aiQuery}
                    onChange={(e) => setAiQuery(e.target.value)}

                      if (e.key === 'Enter') handleSendAiMessage();
                    }}
                    placeholder="ถามคำถาม เช่น คณะธรรมยุติก่อตั้งอย่างไร?..."

                    disabled={isAiLoading}
                  />
                  <button 
                    onClick={() => handleSendAiMessage()}
                    disabled={isAiLoading || !aiQuery.trim()}
                    className="bg-amber-600 hover:bg-amber-700 disabled:bg-slate-300 text-white p-3 rounded-xl active:scale-95 transition-all flex items-center justify-center shrink-0"
                  >
                    <Icons.PaperAirplane className="w-5 h-5" />
                  </button>
                </div>

              </div>
            )}

                  <button 
                    onClick={() => setLibrarySubTab("cards")}
                    className={`py-1.5 px-1 rounded-lg text-xs font-bold transition-all ${librarySubTab === "cards" ? "bg-white text-amber-800 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}
                  >
                    การ์ดคำศัพท์
                  </button>
                  <button 
                    onClick={() => setLibrarySubTab("search")}
                    className={`py-1.5 px-1 rounded-lg text-xs font-bold transition-all ${librarySubTab === "search" ? "bg-white text-amber-800 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}
                  >
                    สืบค้นสากล
                  </button>
                  <button 
                    onClick={() => setLibrarySubTab("bookmarks")}
                    className={`py-1.5 px-1 rounded-lg text-xs font-bold transition-all ${librarySubTab === "bookmarks" ? "bg-white text-amber-800 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}
                  >
                    บันทึกสอบ ({bookmarks.length})
                  </button>
                </div>

                {/* Sub Tab: Interactive Flashcards */}
                {librarySubTab === "cards" && (
                  <div className="space-y-4 flex flex-col justify-between">
                    <div className="space-y-1">
                      <p className="text-[11px] text-slate-500">
                        เครื่องมือสำหรับทบทวนแนวคิดสำคัญในบทเรียนคั่นหน้าได้ คลิกเพื่อพลิกการ์ดเพื่อดูข้อมูลแง่มุมความรู้
                      </p>
                    </div>

                    <div className="flex items-center justify-center py-4">
                      <div 
                        className="w-full max-w-[280px] h-[300px] perspective cursor-pointer"
                        onClick={() => setIsFlipped(!isFlipped)}
                      >
                        <div className={`w-full h-full duration-500 transform-style-3d relative ${isFlipped ? 'rotate-y-180' : ''}`}>
                          
                          {/* Front */}
                          <div className="absolute w-full h-full bg-white rounded-2xl border-2 border-amber-200 shadow-md p-6 flex flex-col justify-between backface-hidden items-center text-center">
                            <div className="w-full flex justify-between text-slate-300">
                              <span className="text-[10px] font-bold tracking-wider uppercase text-slate-400">คีย์เวิร์ด</span>
                              <button 
                                onClick={(e) => { e.stopPropagation(); toggleBookmark(cardIndex, "card"); }}
                                className="text-amber-500 hover:text-amber-600 active:scale-90 transition-transform"
                              >
                                <Icons.Bookmark className="w-5 h-5" fill={isBookmarked(cardIndex, "card") ? "currentColor" : "none"} />
                              </button>
                            </div>
                            <div className="space-y-2">
                              <div className="bg-amber-100 p-2.5 rounded-full inline-block">
                                <Icons.Crown className="w-8 h-8 text-amber-600"/>
                              </div>
                              <h4 className="text-base font-bold text-slate-800 leading-snug break-words">
                                {flashcardsData[cardIndex].term}
                              </h4>
                            </div>
                            <span className="text-[11px] bg-slate-100 text-slate-500 py-1.5 px-3 rounded-full font-medium">
                              คลิกเพื่อพลิกการ์ด
                            </span>
                          </div>

                          {/* Back */}
                          <div className="absolute w-full h-full bg-gradient-to-br from-amber-600 to-amber-700 text-white rounded-2xl shadow-md p-6 flex flex-col justify-between rotate-y-180 backface-hidden items-center text-center">
                            <div className="w-full flex justify-between text-yellow-200/50">
                              <span className="text-[10px] font-bold tracking-wider uppercase">ความหมาย / ข้อมูล</span>
                              <span className="text-[10px] font-bold">Chakri Dynasty</span>
                            </div>
                            <p className="text-xs font-medium leading-relaxed px-1">
                              {flashcardsData[cardIndex].definition}
                            </p>
                            <span className="text-[11px] bg-white/20 text-yellow-100 py-1.5 px-3 rounded-full">
                              คลิกเพื่อพลิกกลับ
                            </span>
                          </div>

                        </div>
                      </div>
                    </div>

                    <div className="space-y-3">
                      <div className="flex justify-between items-center text-[11px] text-slate-400 font-semibold px-2">
                        <span>การ์ดที่ {cardIndex + 1} จาก {flashcardsData.length}</span>
                        <span>{isFlipped ? "คำแปล" : "คำศัพท์"}</span>
                      </div>
                      
                      <div className="grid grid-cols-2 gap-3">
                        <button 
                          onClick={() => {
                            setIsFlipped(false);
                            setTimeout(() => {
                              setCardIndex(cardIndex > 0 ? cardIndex - 1 : flashcardsData.length - 1);
                            }, 150);
                          }}
                          className="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-xs font-bold py-2.5 px-4 rounded-xl active:scale-95 transition-all text-center"
                        >
                          ย้อนกลับ
                        </button>
                        <button 
                          onClick={() => {
                            setIsFlipped(false);
                            setTimeout(() => {
                              setCardIndex(cardIndex < flashcardsData.length - 1 ? cardIndex + 1 : 0);
                            }, 150);
                          }}
                          className="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-2.5 px-4 rounded-xl active:scale-95 transition-all text-center shadow-sm"
                        >
                          คำถัดไป
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {librarySubTab === "search" && (
                  <div className="space-y-4">
                    <div className="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-2">
                      <Icons.Search className="text-slate-400 shrink-0"/>
                      <input 
                        type="text" 
                        placeholder="พิมพ์เพื่อค้นหา เช่น ปูนซีเมนต์ไทย, ตราสามดวง..." 
                        className="text-xs text-slate-700 w-full focus:outline-none"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                      />
                      {searchQuery && (
                        <button onClick={() => setSearchQuery("")} className="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold px-2 py-0.5 rounded-lg">
                          ล้าง
                        </button>
                      )}
                    </div>

                      <div className="space-y-2">
                        {searchResults.length > 0 ? (
                          searchResults.map((res, idx) => (

                              key={idx} 
                              onClick={() => {
                                if (res.type === "king") {
                                  setActiveKing(res.raw);
                                  setCurrentTab("kings");
                                } else {
                                  setCardIndex(res.id);
                                  setLibrarySubTab("cards");
                                }
                              }}
                              className="bg-white p-3 rounded-xl border border-amber-100 shadow-sm hover:border-amber-200 cursor-pointer active:scale-[0.99] transition-all"
                            >
                              <div className="flex justify-between items-center mb-1">
                                <span className="text-[9px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded">
                                  {res.type === "king" ? "ทำเนียบรัชกาล" : "คีย์เวิร์ด"}
                                </span>
                                <Icons.ChevronRight className="text-slate-300 w-4 h-4"/>
                              </div>
                              <h5 className="text-xs font-bold text-slate-800 leading-tight">{res.title}</h5>
                              <p className="text-[11px] text-slate-500 leading-relaxed italic mt-1">
                                "...{res.snippet}..."
                              </p>
                            </div>
                          ))

                          <div className="bg-white p-6 rounded-2xl border border-slate-100 text-center text-xs text-slate-400">

                          </div>
                        )}

                          const id = parseInt(idStr);

                          if (type === "king") {
                            const kingObj = kingsList.find(k => k.id === id);
                            if (!kingObj) return null;
                            return (
                              <div 
                                key={bookmarkKey}
                                onClick={() => { setActiveKing(kingObj); setCurrentTab("kings"); }}
                                className="bg-white p-3 rounded-xl border border-slate-100 hover:border-amber-100 shadow-sm cursor-pointer flex justify-between items-center"
                              >
                                <div className="space-y-0.5">
                                  <span className="text-[9px] bg-amber-50 text-amber-700 px-1.5 py-0.5 rounded-md font-bold">ประวัติรัชกาล</span>
                                  <h5 className="text-xs font-bold text-slate-800">{kingObj.title}: {kingObj.fullName}</h5>
                                </div>
                                <button 
                                  onClick={(e) => { e.stopPropagation(); toggleBookmark(id, "king"); }}
                                  className="text-amber-500 hover:text-amber-600 p-1 rounded-lg"
                                >
                                  <Icons.Bookmark className="w-4 h-4" fill="currentColor"/>
                                </button>
                              </div>
                            );
                          } else if (type === "card") {
                            const cardObj = flashcardsData[id];
                            if (!cardObj) return null;
                            return (
                              <div 
                                key={bookmarkKey}
                                onClick={() => { setCardIndex(id); setLibrarySubTab("cards"); }}
                                className="bg-white p-3 rounded-xl border border-slate-100 hover:border-amber-100 shadow-sm cursor-pointer flex justify-between items-center"
                              >
                                <div className="space-y-0.5">
                                  <span className="text-[9px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded-md font-bold">คีย์เวิร์ด</span>
                                  <h5 className="text-xs font-bold text-slate-800">{cardObj.term}</h5>
                                </div>
                                <button 
                                  onClick={(e) => { e.stopPropagation(); toggleBookmark(id, "card"); }}
                                  className="text-amber-500 hover:text-amber-600 p-1 rounded-lg"
                                >
                                  <Icons.Bookmark className="w-4 h-4" fill="currentColor"/>
                                </button>
                              </div>
                            );
                          }
                          return null;
                        })}
                      </div>
                    ) : (
                      <div className="bg-white p-6 rounded-2xl border border-slate-100 text-center text-xs text-slate-400">
                        ยังไม่มีรายการคั่นหน้าสำหรับการจัดสอบ คั่นหน้าข้อมูลสำคัญในแท็บอื่นๆ เพื่อนำมาแสดงไว้ที่นี่
                      </div>
                    )}
                  </div>
                )}

              </div>
            )}

          </main>

          {/* Bottom Thumb-Friendly Navigation Bar */}
          <nav className="absolute bottom-0 inset-x-0 bg-white border-t border-slate-200 rounded-b-3xl py-2 px-3 flex justify-between items-center shadow-[0_-4px_10px_rgba(0,0,0,0.05)] z-20">
            
            <button 
              onClick={() => { setCurrentTab("home"); setSearchQuery(""); }}
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl active:scale-95 transition-all ${currentTab === "home" ? "text-amber-600 font-bold bg-amber-50" : "text-slate-400 hover:text-slate-600"}`}
            >
              <Icons.Home className="w-5.5 h-5.5"/>
              <span className="text-[10px]">คติความเชื่อ</span>
            </button>

            <button 
              onClick={() => { setCurrentTab("kings"); setSearchQuery(""); }}
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl active:scale-95 transition-all ${currentTab === "kings" ? "text-amber-600 font-bold bg-amber-50" : "text-slate-400 hover:text-slate-600"}`}
            >
              <Icons.Crown className="w-5.5 h-5.5"/>
              <span className="text-[10px]">ทำเนียบ ร.1-9</span>
            </button>

            <button 
              onClick={() => { setCurrentTab("quiz"); setSearchQuery(""); }}
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl active:scale-95 transition-all ${currentTab === "quiz" ? "text-amber-600 font-bold bg-amber-50" : "text-slate-400 hover:text-slate-600"}`}
            >
              <Icons.CheckSquare className="w-5.5 h-5.5"/>
              <span className="text-[10px]">แบบทดสอบ</span>
            </button>

            {/* AI Advisor Tab */}
            <button 
              onClick={() => { setCurrentTab("ai_tutor"); setSearchQuery(""); }}
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl active:scale-95 transition-all ${currentTab === "ai_tutor" ? "text-amber-600 font-bold bg-amber-50" : "text-slate-400 hover:text-slate-600"}`}
            >
              <Icons.Sparkles className="w-5.5 h-5.5 text-amber-600"/>
              <span className="text-[10px] font-bold">ถาม AI</span>
            </button>

            <button 
              onClick={() => { setCurrentTab("library"); }}
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl active:scale-95 transition-all ${currentTab === "library" ? "text-amber-600 font-bold bg-amber-50" : "text-slate-400 hover:text-slate-600"}`}
            >
              <Icons.Book className="w-5.5 h-5.5"/>
              <span className="text-[10px]">คลังความรู้</span>
            </button>

          </nav>

        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App/>);
  </script>
</body>
</html>
